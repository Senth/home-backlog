# What this repo considers proof, and how to boot it.
# The stage logic lives in the global agents; this file and `docs/` are all the repo carries.

[gates]
# Ordered, cheapest first. Every one runs, every time.
# `lint --write` fixes what it can, so it goes first and the rest see formatted
# source. `e2e` boots the stack itself: `dev-stack.sh up` is idempotent and
# reuses a stack that is already running.
commands = [
  "yarn lint --write",
  "yarn invariants",
  "yarn typecheck",
  "yarn test",
  "scripts/dev-stack.sh up && yarn e2e",
]

[review]
# Globs that make a change user-visible, and whether this repo has a browser stage.
#
# These are the paths where a household could notice. They are the floor, not the
# verdict: the reviewer reads the diff and answers `User-visible: yes | no`, and a
# change under `models/` or `data/` that alters what renders is user-visible even
# though no glob here matches it. A new file under `components/` that nothing routes
# to yet is not.
visible_paths = [
  "app/**",
  "components/**",
  "contexts/**",
  "hooks/**",
  "theme/**",
  "i18n/locales/**",
  "assets/**",
  "public/**",
]
browser = true

[dev]
# How `browser-review` brings the app up. Nothing else boots anything.
#
# Ports are never literals here: every `up` that actually boots allocates a free
# block in 7000-7999 and records it in gitignored `.tmp/dev-stack/stack.json`, so
# two worktrees can each run a full stack. `up` also prints the web URL on its
# last line.
start = "scripts/dev-stack.sh up"
url = "http://localhost:$(jq -r .ports.web .tmp/dev-stack/stack.json)"
# Sign-in is a **redirect**, not a popup — `GoogleSignIn.web.tsx` uses
# `signInWithRedirect` on purpose, because a popup dead-ends in an installed PWA.
# The browser leaves for the Auth emulator's own account picker and comes back,
# in one tab throughout: click "Continue with Google", then `marcus@example.com`,
# then pick the home **Huset**. Without an active home, `/projects`, `/locations`
# and `/maintenance` all redirect to `/homes` and you review the wrong screen.
# `.tmp/e2e/auth.json` does not shortcut this: Firebase keeps its session in
# IndexedDB and `state-load` restores cookies and `localStorage` only.
auth = "click 'Continue with Google' -> marcus@example.com -> home 'Huset'"
ready = "Huset"

# What `.emulator-seed` holds, so an empty screen is judged and not reported:
# eighteen nodes across Backlog / Next Up / Execution / Done — sixteen under
# Huset and two under Stugan, those two without a due date, a priority or
# notes. Fifteen of the eighteen have no due date and no priority, and
# fifteen have no notes, so anything surfacing "overdue" or "due soon" is
# legitimately empty. Huset holds **six
# label definitions, all preset hues** (#100), and two of its cards carry
# labels: "Renovera badrummet" has a priority and **all six** — the
# full-gutter shape the card face is built around — and "Beställ en tystare
# fläkt" carries one; no label is a custom color, so the palette sweep can
# enumerate everything a labelled card paints. There are **no `recurring` and
# no `locations` documents at all**: the maintenance screen and the location
# tree are empty by construction, which is the cold-start shape. Two accounts
# — Marcus / marcus@example.com and Anna Maria Berg / anna@example.com — one
# pending invite, two API keys, no attachments. Whether an empty state
# explains itself is still fair game; reporting the emptiness as data loss is
# not.

[design]
# The contract and the values it is written against. `theme/tokens.ts` is ground
# truth: when the contract and the file disagree, the file is right and the contract
# is stale. Nobody edits the contract mid-run — a finding cites a rule in it or is
# flagged a taste call, and proposed rule changes go to the human as one diff.
# Personal repo: the product-specific taste lives in `docs/DESIGN.md` sections, not
# in a repo design skill.
contract = "docs/DESIGN.md"
tokens = "theme/tokens.ts"
