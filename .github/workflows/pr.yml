name: PR - Lint, typecheck, test and build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      # Full history: `yarn invariants` diffs against the PR's base branch to
      # check that a rules change brought its rules tests with it, and a
      # shallow single-branch checkout has no base commit to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # The Firestore and Storage emulators are Java processes, and
      # firebase-tools 15 refuses to launch them on anything below JDK 21.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # The emulator jars are downloaded on first use and never change per
      # firebase-tools version, so caching them saves ~30s a run.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Yarn install
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Lint
        uses: borales/actions-yarn@v5
        with:
          cmd: lint

      # The grep-shaped half of the CLAUDE.md invariants. Deliberately its own
      # step rather than folded into `lint`, so a failure names the rule that
      # broke instead of arriving as a biome exit code.
      - name: Check invariants
        run: yarn invariants --base origin/${{ github.base_ref || github.event.repository.default_branch }}

      - name: Typecheck
        uses: borales/actions-yarn@v5
        with:
          cmd: typecheck

      - name: Test
        uses: borales/actions-yarn@v5
        with:
          cmd: test --watchAll=false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # firestore.rules and storage.rules are the only thing standing between a
      # household's private nodes and everyone else. They get their own suite.
      - name: Test security rules
        uses: borales/actions-yarn@v5
        with:
          cmd: test:rules

      - name: Export environment variables
        run: echo "${{ secrets.ENV }}" > .env.local

      # The checks that used to be a browser agent's checklist, and are now
      # assertions: the console, an offline write surviving a reload, reload and
      # back, deep links, contrast in both color schemes, touch targets, and
      # untranslated strings in sv-SE. `browser-review` keeps only what a machine
      # cannot decide. Chromium is cached because the download is ~115 MB.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      # `yarn e2e` boots the emulators and the Expo web server through
      # `scripts/dev-stack.sh`, then runs the suite against it. The emulator jars
      # are already cached by the step above this job's rules tests.
      - name: End-to-end tests
        uses: borales/actions-yarn@v5
        with:
          cmd: e2e

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: .tmp/e2e/report
          retention-days: 7

      - name: Build web
        uses: borales/actions-yarn@v5
        with:
          cmd: build:web
