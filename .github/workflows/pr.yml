name: PR - Lint, typecheck, test and build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # The Firestore and Storage emulators are Java processes.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # The emulator jars are downloaded on first use and never change per
      # firebase-tools version, so caching them saves ~30s a run.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators

      - name: Yarn install
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Lint
        uses: borales/actions-yarn@v5
        with:
          cmd: lint

      - name: Typecheck
        uses: borales/actions-yarn@v5
        with:
          cmd: typecheck

      - name: Test
        uses: borales/actions-yarn@v5
        with:
          cmd: test --watchAll=false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # firestore.rules and storage.rules are the only thing standing between a
      # household's private nodes and everyone else. They get their own suite.
      - name: Test security rules
        uses: borales/actions-yarn@v5
        with:
          cmd: test:rules

      - name: Export environment variables
        run: echo "${{ secrets.ENV }}" > .env.local

      - name: Build web
        uses: borales/actions-yarn@v5
        with:
          cmd: build:web
